<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Rock Paper Scissors</h1>
    <p id="msg1">Welcome to the game!</p>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="sample2.png" alt="rock">
        </div>
        <div class="choice" id="paper">
            <img src="sample3.png" alt="paper">
        </div>
        <div class="choice" id="scissors">
            <img src="sample1.jpg" id="img1" alt="scissors">
        </div>
    </div>

    <div class="score-board">
        <div class="score">
            <p id="user-score">User: 0</p>
            <p>You</p>
        </div>

        <div class="score">
            <p id="computer-score">Computer: 0</p>
            <p>Computer</p>
        </div>

    </div>

    <div class="msg-container">
        <p id="msg2">Play Your Move!</p>
    </div>
    <button id="restart-btn">Restart Game</button>
    <script src="app.js"></script>
</body>

</html>
